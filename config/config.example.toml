# JMS endpoint. Paths are
# /login, /bookingv2/findrooms, /bookingv2
base_url = "https://frontdoor.spa.gla.ac.uk/timetable"


# How many times to poll for the room before giving up.
# Runs at 23:59:55 to catch the booking window opening at midnight,
# so this needs to span the few seconds either side.
max_retry = 7
retry_delay = 0.5

# HTTP timeout per request, seconds.
timeout = 30

# How far ahead to book. The booking window is 7 days, but the timer
# fires at 23:59:55,so still "today". The slot opening at midnight
# is 8 days out from the script's point of view.
booking_days_ahead = 8

# Hour offset applied to both the findrooms search and the booking payload
# The API stores times in UTC and displays them in local time, so during BST
# the script has to send local time minus one hour.
# -1 during BST. Should become 0 when BST ends on OCT.
# Happened around last BST/GMT changeover, but not exactly.
findrooms_hour_offset = -1
